[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Devin AI" }
]
dependencies = [
    "django>=6.0.3",
    "djangorestframework>=3.16.1",
    "django-cors-headers>=4.9.0",
    "pillow>=12.1.1",
]
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
